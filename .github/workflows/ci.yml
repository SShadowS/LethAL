name: CI

# Runs on every push and pull request. Deliberately does NOT run the integration gates: those
# publish to a live Business Central container, are env-gated (LETHAL_ITEST_*), and take minutes
# each. They stay a human-invoked, machine-local gate — see CLAUDE.md.
#
# Every branch, not just master. A gate that only runs after a merge tells you about a problem you
# have already shipped, and a `branches: [master]` filter means a feature branch gets no signal at
# all until someone opens a pull request — which is exactly how this file was first written, and
# the push that was meant to test it triggered nothing.
on:
  push:
  pull_request:

jobs:
  check:
    # windows-latest, not ubuntu, because this is a Windows-first tool: the AL compiler, altool and
    # the BC containers it drives are Windows, the development machine is Windows, and the unit
    # suite has never been run on Linux. Building the Linux and macOS binaries is a separate job on
    # a tag (release.yml) and does not need the suite to have passed on those platforms.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # RUST-03 S1.2: build and test the native parser addon with clang before anything else, so a
      # broken native build fails CI at the step that caused it instead of surfacing as a mystery
      # test failure later. clang, not MSVC cl.exe: build.rs refuses a non-clang CC (S1.1), and
      # cc-rs's CC_<target>/TARGET_CC lookup order is stripped down to just CC by
      # scripts/build-native-parser.ts so no stray env var can swap the compiler silently.
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: LLVM 23.1.2 (clang-cl builds the grammar)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "23.1.2"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            packages/engine/native/target
          key: native-${{ runner.os }}-${{ hashFiles('packages/engine/native/Cargo.lock', 'packages/engine/native/src/**', 'packages/engine/native/build.rs') }}
      - name: Build the native parser (grammar check, clang, provenance)
        shell: bash
        run: CARGO_TARGET_DIR=packages/engine/native/target LLVM_BIN="$LLVM_PATH/bin" bun scripts/build-native-parser.ts
      - name: Native Rust tests
        shell: bash
        run: CARGO_TARGET_DIR=packages/engine/native/target LLVM_BIN="$LLVM_PATH/bin" bun scripts/build-native-parser.ts --test
      - name: Native notice inventory is current
        run: bun scripts/native-notices.ts --check

      # The order matters and is the one in CLAUDE.md. `tsc --build` regenerates packages/*/dist,
      # whose stale compiled *.test.js are then picked up by `bun test` as phantom failures, so the
      # clean sits BETWEEN the two rather than before both.
      - name: Typecheck
        run: bun run typecheck

      - name: Remove compiled dist before testing
        shell: bash
        run: rm -rf packages/*/dist

      - name: Unit tests
        run: bun test

      # `biome check .` is not run repo-wide on purpose: it reports pre-existing organizeImports and
      # format debt in engine/ and builtin-tier1/, so a repo-wide run would fail every build and
      # teach everyone to ignore this job. Formatting is enforced per-file by a local PostToolUse
      # hook instead. Making the whole repository clean is the prerequisite for adding it here.
