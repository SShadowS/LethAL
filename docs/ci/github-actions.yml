# LethAL on a pull request: GitHub Actions (example; PR-70).
#
# What it does: mutation-tests only the AL lines the pull request changes (`--changed-since`), then exports the report in
# the mutation-testing-elements format (`lethal export`, R178) and uploads it as an artifact you can render with
# `npx mutation-testing-elements`. LethAL gates on nothing: exit 0 means the run completed, whatever survived (see
# docs/ci/README.md for the exit codes and docs/ci/threshold-options.md for why there is no score threshold yet).
#
# Assumptions, adjust them for your repository:
# - `lethal` is on the agent's PATH: there is no published release yet, so build it once (README, "Installation") and put
#   it on a self-hosted runner, or build it in an earlier step.
# - The app is in `app/` and its tests in `test/`; `lethal.config.json` is next to them (README, "Configuration").
# - `al-runner-v3` runs offline on Linux x64 and is NOT authoritative; for BC's own answers use `--backend bcdev` on a
#   runner that reaches a BC sandbox (never a production tenant).
# - The exported JSON embeds your source, so keep the artifact inside your organisation.
name: mutation-test

on:
  pull_request:

jobs:
  lethal:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --changed-since needs the history shared with the base branch

      - name: Mutation-test the changed lines
        shell: bash
        run: |
          set +e
          lethal run --project app --tests test --backend al-runner-v3 --config app/lethal.config.json --changed-since origin/${{ github.base_ref }} --out lethal-report.json --progress-out lethal-events.ndjson
          rc=$?
          case "$rc" in
            0) echo "LethAL: run completed" ;;
            3) echo "::error::LethAL quarantined the run: it refused to vouch for its own verdicts (see the report's validity)" ;;
            4) echo "::error::LethAL scored nothing: every mutant errored" ;;
            7) echo "::error::LethAL stopped early (time budget or a signal); the report is partial, rerun with --resume" ;;
            *) echo "::error::LethAL failed with exit code $rc (the message is on stderr)" ;;
          esac
          exit "$rc"

      - name: Export the report for display
        if: ${{ always() && hashFiles('lethal-report.json') != '' }}
        run: lethal export lethal-report.json --format mutation-elements --project app --out mutation-report.json

      - name: Upload the reports
        if: ${{ always() && hashFiles('lethal-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lethal-mutation-report
          path: |
            lethal-report.json
            mutation-report.json
            lethal-events.ndjson
